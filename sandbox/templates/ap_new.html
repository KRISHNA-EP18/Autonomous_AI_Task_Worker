<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Create AP Invoice</title>
</head>

<body>
    {% if error %}
<p style="color: red;">
    <strong>Error:</strong> {{ error }}
</p>
{% endif %}

<h1>Create AP Invoice</h1>

<form method="post" action="/ap/new">

    <label for="invoice_number">
        Invoice Number:
    </label>

    <input
        type="text"
        id="invoice_number"
        name="invoice_number"
        required
    >

    <br><br>

    <label for="vendor">
        Vendor:
    </label>

    <input
        type="text"
        id="vendor"
        name="vendor"
        required
    >

    <br><br>

    <label for="amount">
        Amount:
    </label>

    <input
        type="number"
        id="amount"
        name="amount"
        step="0.01"
        required
    >

    <br><br>

    <label for="currency">
        Currency:
    </label>

    <input
        type="text"
        id="currency"
        name="currency"
        value="INR"
        required
    >

    <br><br>

    <label for="due_date">
        Due Date:
    </label>

    <input
        type="date"
        id="due_date"
        name="due_date"
        required
    >

    <br><br>

    <button type="submit">
        Submit Invoice
    </button>

</form>

<br>

<a href="/ap">Back to AP</a>

</body>
</html>
